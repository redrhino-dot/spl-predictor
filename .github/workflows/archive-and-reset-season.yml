name: Archive and Reset Season

on:
  workflow_dispatch:
    inputs:
      archive_season:
        description: 'Season to archive, e.g. 2025-26'
        required: true
        default: '2025-26'
      new_season_year:
        description: 'Season start year for CONFIG.season, e.g. 2026'
        required: true
        default: '2026'
      new_season_label:
        description: 'Display label for new season, e.g. GW1 — TBD'
        required: true
        default: 'GW1 — TBD'

permissions:
  contents: write

jobs:
  archive-and-reset:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create archive folders
        run: |
          mkdir -p "archive/${{ github.event.inputs.archive_season }}/data"
          mkdir -p "archive/${{ github.event.inputs.archive_season }}/scripts"

      - name: Archive current live files
        run: |
          [ -f data/archive.json ] && cp data/archive.json "archive/${{ github.event.inputs.archive_season }}/data/archive.json" || true
          [ -f data/fixtures.json ] && cp data/fixtures.json "archive/${{ github.event.inputs.archive_season }}/data/fixtures.json" || true
          [ -f data/livescores.json ] && cp data/livescores.json "archive/${{ github.event.inputs.archive_season }}/data/livescores.json" || true
          [ -f data/predictions.json ] && cp data/predictions.json "archive/${{ github.event.inputs.archive_season }}/data/predictions.json" || true
          [ -f data/config.js ] && cp data/config.js "archive/${{ github.event.inputs.archive_season }}/data/config.js" || true
          [ -f scripts/fetch_fixtures.py ] && cp scripts/fetch_fixtures.py "archive/${{ github.event.inputs.archive_season }}/scripts/fetch_fixtures.py" || true

      - name: Reset fixtures.json
        run: |
          cat > data/fixtures.json <<'EOF'
          {
            "updated": null,
            "round": "scottish-premiership",
            "week_number": 1,
            "fixtures": []
          }
          EOF

      - name: Reset livescores.json
        run: |
          cat > data/livescores.json <<'EOF'
          {
            "updated": null,
            "livescores": []
          }
          EOF

      - name: Reset predictions.json
        run: |
          cat > data/predictions.json <<'EOF'
          {
            "gameweeks": {}
          }
          EOF

      - name: Reset archive.json
        run: |
          cat > data/archive.json <<'EOF'
          {
            "gameweeks": {}
          }
          EOF

      - name: Overwrite config.js for new season
        run: |
          cat > data/config.js <<'EOF'
          // auto-updated config

          const CONFIG = {
            "githubPAT": ['github_pat_11B4JHOFQ', '00M5KnxT8h4jU_BCRac2McVqIi8kKAhKCM1pG4WCpg3XVcRcC2yiN00lB2D3Q7WG39xz8u0Og'].join(''),
            "githubOwner": "redrhino-dot",
            "githubRepo": "spl-predictor",
            "leagueId": 179,
            "season": ${{ github.event.inputs.new_season_year }},
            "currentGameweek": 1,
            "currentGwLabel": "${{ github.event.inputs.new_season_label }}",
            "participants": [
              "Graham",
              "Jon",
              "Kris",
              "Doug"
            ],
            "pins": {
              "Graham": "1002",
              "Jon": "7429",
              "Kris": "1940",
              "Doug": "1030"
            },
            "openingStandings": [
              {
                "name": "Graham",
                "points": 0
              },
              {
                "name": "Jon",
                "points": 0
              },
              {
                "name": "Kris",
                "points": 0
              },
              {
                "name": "Doug",
                "points": 0
              }
            ],
            "teamAliases": {
              "Hibs": "Hibernian",
              "Huns": "Rangers",
              "Celtic": "Celtic",
              "St M": "St Mirren",
              "Dons": "Aberdeen",
              "Yinited": "Dundee United",
              "Utd": "Dundee United",
              "Livi": "Livingston",
              "Well": "Motherwell",
              "Killie": "Kilmarnock",
              "Hearts": "Heart of Midlothian",
              "Dundee": "Dundee"
            },
            "seededPredictions": {
              "gw": 1,
              "submittedAt": null,
              "byFixture": []
            }
          };
          EOF

      - name: Write archive README
        run: |
          cat > "archive/${{ github.event.inputs.archive_season }}/README.md" <<EOF
          # Archived season ${{ github.event.inputs.archive_season }}

          Archived by GitHub Actions on $(date -u +"%Y-%m-%d %H:%M:%S UTC").
          Reset live data for season start year ${{ github.event.inputs.new_season_year }}.
          New gameweek label: ${{ github.event.inputs.new_season_label }}.
          EOF

      - name: Show changed files
        run: |
          git status --short

      - name: Commit and push changes
        run: |
          git add archive data
          git commit -m "Archive ${{ github.event.inputs.archive_season }} and reset for season ${{ github.event.inputs.new_season_year }}" || echo "No changes to commit"
          git push
